[tool.poetry]
name = "nwp-demo"
# Keep only Major and Minor version in this configuration,
# the patch version is calculated when releasing the library
version = "1.0"
description = "Demo scripts and notebooks for reading and processing forecast data using Polytope."
authors = ["MeteoSwiss"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11.5,<3.12"
meteodata-lab = {extras = ["polytope", "regrid"], git = "https://github.com/meteoswiss/meteodata-lab.git", branch = "regrid_real"}
pyfdb = "0.1.3"
fdb-utils = { git = "https://github.com/MeteoSwiss/fdb-utils.git", tag = "v1.1.5"}
ipykernel = "*"
earthkit-data = ">=0.16.3"
earthkit-plots = "*"
earthkit-geo = "*"
earthkit-meteo = "*"
nbconvert = "*"
pyyaml = "*"
black = "^26.3.1"

[tool.poetry.group.dev.dependencies]
black = "^26.3.1"

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = "."

[tool.yapf]
based_on_style = "pep8"
column_limit = "120"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
